# QUAN TRỌNG: Dùng 'validate' thay vì 'update' vì schema có PostgreSQL Triggers
# và EXCLUDE USING gist(...) mà Hibernate không tự tạo được.
# Chạy toàn bộ SQL script vào PostgreSQL một lần trước khi khởi động ứng dụng.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

